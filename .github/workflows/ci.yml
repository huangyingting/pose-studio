name: CI

# Off the development machine: the checks, the slow unit tests and the browser tests (split
# across four runners), side by side. Pushes are not held for it; failures are fixed after.
on:
  push:
    branches: [main]
  pull_request:

# One run at a time: a run in progress finishes (its results are read); only the newest push waits.
# (Each job has a time limit, so that one stuck on its runner, installing, does not hold the rest.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # (Nothing left unused: files, exports, dependencies.)
      - run: npm run knip
      - run: npm test
      # The static edition (GitHub Pages) must not contain any account, sync or AI code.
      - run: npm run build:static && ! grep -rlE "next-auth|/api/ai|/api/library" out

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:slow -- --shard=${{ matrix.shard }}/4

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      # (Shards by time, not by count: Playwright takes the tests in order, each shard as many as
      # fill about the same time; 32, 14, 24 and 18 of 88 at a run's times, some 5 minutes each.
      # Weigh them again from a run's times when tests are added.)
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          PWTEST_SHARD_WEIGHTS: '32:14:24:18'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
